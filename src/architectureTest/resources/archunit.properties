# ArchUnit configuration for the architectureTest suite.
#
# The frozen violation store records architecture debt that predates this gate.
# It is a ratchet: new violations fail the build, and a fixed violation must be
# removed from the store in the same pull request that fixes it.
#
# Store creation is disabled so that a missing or mislocated store fails loudly
# instead of silently re-recording whatever the build happens to find.
freeze.store.default.path=config/archunit/frozen
freeze.store.default.allowStoreCreation=false
freeze.refreeze=false
