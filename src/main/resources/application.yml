server:
  port: 8080
  shutdown: graceful # let in-flight requests finish before the container stops
  # No reverse proxy or load balancer sits in front of this application today
  # (see ADR 0002), so no forwarded header is trusted: a client cannot spoof
  # its perceived scheme, host, or address through X-Forwarded-*. Revisit this
  # only once a real trusted proxy is introduced, together with its IP allowlist.
  forward-headers-strategy: none
  compression:
    enabled: true #Whether response compression is enabled
    mime-types: text/html, text/xml, text/plain, text/css, text/javascript, application/javascript, application/json #Comma-separated list of MIME types that should be compressed.
    min-response-size: 1024 #Minimun "Content-length" value that is required for compression to be performed
  undertow:
    threads:
      worker: 64 #Generally this should be reasonably high, at least 10 per CPU core: https://undertow.io/undertow-docs/undertow-docs-2.1.0/index.html#listeners-2
    # Defense-in-depth backstop behind AbuseControlInterceptor's own, cleaner
    # 413 (issue #17): a request without a Content-Length header (chunked
    # transfer-encoding) skips that check, so the container itself also caps
    # the body it will ever buffer. Matches app.abuse-control.max-request-body-bytes.
    max-http-post-request-size: 16384
#      io: 4 # One ID thread per CPU core is a reasonable default: https://undertow.io/undertow-docs/undertow-docs-2.1.0/index.html#listeners-2
spring:
  lifecycle:
    timeout-per-shutdown-phase: 20s
  mvc:
    problemdetails:
      enabled: true # ensures even Boot's own fallback error handling uses RFC 9457 shape
  datasource:
    url: ${DATABASE_POSTGRES_URL}?useSSL=true&serverTimezone=UTC&characterEncoding=UTF-8
    username: ${DATABASE_POSTGRES_USERNAME}
    password: ${DATABASE_POSTGRES_PASSWORD}
    hikari:
      auto-commit: false
      connection-timeout: 250 # Ms config. The ideal is maintaining this low to provide a fast timeout without retaining the thread for long periods.
      max-lifetime: 600000
      maximum-pool-size: 20 # maintain max of 20 connections with the database, this is costly to be managed by the RDBMS. see https://github.com/brettwooldridge/HikariCP/wiki/About-Pool-Sizing
      minimum-idle: 10
      pool-name: master
  flyway:
    # Flyway owns schema evolution; Hibernate only ever checks against it below.
    # db-scripts/schema.sql (a Docker init script) is retired in the same
    # change that introduces this migration history - there is one canonical
    # schema source, not two.
    enabled: true
    locations: classpath:db/migration
  jpa:
    open-in-view: false
    show-sql: true
    hibernate:
      # Fails startup fast on any mismatch between the entities and the
      # migrated schema, rather than silently creating or altering tables.
      ddl-auto: validate
    properties:
      "[hibernate.connection.provider_disables_autocommit]": true
      # To improve the performance to the max, disable the auto-commit and the open-in-view
      # https://vladmihalcea.com/why-you-should-always-use-hibernate-connection-provider_disables_autocommit-for-resource-local-jpa-transactions/
fiscal:
  service:
    api:
      endpoint: "https://api.fiscaldata.treasury.gov/services/api/fiscal_service/v1/accounting/od/rates_of_exchange"
  client:
    connect-timeout: 2s
    request-timeout: 5s
    total-deadline: 15s
    max-response-bytes: 5242880 # 5 MiB
    max-concurrent-calls: 4
    max-attempts: 4
    initial-backoff: 200ms
    backoff-multiplier: 2.0
    jitter-factor: 0.5
    retryable-status-codes: 429,502,503,504
    max-pages: 20
    circuit-breaker:
      failure-rate-threshold: 50
      sliding-window-size: 20
      wait-duration-in-open-state: 30s
      permitted-calls-in-half-open-state: 5
app:
  country-currency-sync:
    # Scheduler enablement, cron, and timezone for the country-currency
    # catalogue sync (issue #6), explicit and overridable per deployment -
    # tests turn this off entirely rather than let a real scheduled network
    # call run during every test that boots the application.
    enabled: true
    cron: "0 0 2 * * *"
    zone: "UTC"
  abuse-control:
    # Anonymous-abuse baseline (issue #17): all values configurable per
    # deployment, none of them a universal production truth. Client identity
    # is the raw remote address - see AbuseControlInterceptor's own Javadoc
    # for why no forwarded header is honoured while server.forward-headers-strategy
    # stays "none".
    rate-limit-enabled: true
    global:
      capacity: 20
      refill-tokens: 100
      refill-period: 1m
    purchase-creation:
      capacity: 3
      refill-tokens: 10
      refill-period: 1m
    conversion:
      capacity: 5
      refill-tokens: 30
      refill-period: 1m
    country-currencies:
      capacity: 10
      refill-tokens: 60
      refill-period: 1m
    max-request-body-bytes: 16384
    max-page-size: 100
    max-country-currency-filter-length: 100
  purchase-retention:
    # How long an anonymous purchase is kept before a background job deletes
    # it (issue #17). There is no account to reclaim data for and no
    # legitimate reason to keep it indefinitely once its conversion window
    # (six months, see ConversionWindow) has long passed.
    retention: 90d
    # ISO-8601, not the "1h"-style shorthand Duration binding elsewhere in this
    # file also accepts: @Scheduled's own placeholder resolution only falls
    # back to java.time.Duration.parse for a string it cannot read as a plain
    # millisecond long, and that parser is ISO-8601-only.
    cleanup-interval: PT1H
  idempotency:
    # How long a completed or abandoned claim is honored before a repeated
    # Idempotency-Key is treated as a fresh request rather than a replay or a
    # conflict (issue #18).
    retention: 24h
    # How long a request waits for a concurrent, identical request to finish
    # before it gives up and returns 503 instead of blocking indefinitely.
    max-wait: 5s
    poll-interval: 50ms
management:
  endpoints:
    web:
      exposure:
        # health for the Docker healthcheck / compose startup ordering;
        # prometheus for scraping (issue #9). Neither carries its own
        # authentication - see docs/adr/0006-observability-baseline.md for why
        # that is an accepted operator responsibility (keep the scrape
        # endpoint off any public ingress) rather than an application-level
        # concern, consistent with the anonymous-API trust boundary from
        # ADR 0002.
        include: health,prometheus
  endpoint:
    health:
      show-details: never # never leak datasource/disk internals to an unauthenticated caller
      probes:
        enabled: true # exposes /actuator/health/liveness and /actuator/health/readiness
      group:
        readiness:
          # The database is a required dependency: nothing works without it.
          # The fiscal data provider is deliberately excluded - its own
          # circuit breaker already isolates callers from its failures, and a
          # struggling upstream must not take this service out of rotation.
          include: readinessState,db
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  metrics:
    tags:
      # A stable, low-cardinality tag distinguishing this service's series
      # from any other scraped target - not per-instance (no pod/host id):
      # that belongs to the scraper's own target labels.
      application: wexchange
    distribution:
      percentiles-histogram:
        "[http.server.requests]": true
# app.cors.allowed-origins is deliberately not declared here: CorsProperties
# already defaults an absent key to an empty list, and leaving it undeclared
# means a test or deployment overriding it is the only property source for
# that key, rather than competing with an explicit [] here for Boot's
# relaxed-binding precedence on a collection-typed property (issue #16).
